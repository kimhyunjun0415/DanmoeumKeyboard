name: DanmoeumKeyboard

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '16.0'

settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'

targets:
  DanmoeumKeyboard:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Shared

    info:
      path: App/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.danmoeum

    dependencies:
      - target: DanmoeumExtension
        embed: true

  DanmoeumExtension:
    type: app-extension
    platform: iOS

    sources:
      - path: Keyboard
      - path: Shared

    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 단모음
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ko-KR
            RequestsOpenAccess: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.danmoeum.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
